name: 대기질·자외선 API 점검 (수동)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-air.mjs
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
