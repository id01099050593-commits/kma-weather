name: 날씨 업데이트

on:
  schedule:
    # GitHub cron은 UTC 기준 (KST = UTC+9)
    - cron: '0 22 * * *'    # 07:00 KST (05시 발표분)
    - cron: '0 3 * * *'     # 12:00 KST (11시 발표분)
    - cron: '15 11 * * *'   # 20:15 KST (20시 발표분, 20:10쯤 제공)
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 기상청 API 호출 및 페이지 생성
        run: node scripts/update.mjs
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "날씨 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
